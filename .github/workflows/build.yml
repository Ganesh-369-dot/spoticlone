name: Build SpotiClone APK

on:
  workflow_dispatch: # This creates a manual 'Build' button

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Linux Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev libtool autoconf automake pkg-config zip unzip

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython virtualenv

      - name: Auto-Accept Android Licenses
        run: |
          sed -i 's/warn_on_root = 1/warn_on_root = 0/' buildozer.spec || true
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec || true

      - name: Compile the APK
        run: yes | buildozer -v android debug

      - name: Upload the Finished App
        uses: actions/upload-artifact@v4
        with:
          name: SpotiClone-APK
          path: bin/*.apk
