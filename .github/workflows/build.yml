name: Build SpotiClone APK

on:
  workflow_dispatch: 

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Compilers & Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev zip unzip
          pip install --upgrade buildozer cython==0.29.33 virtualenv

      - name: Auto-Generate Perfect Spec File
        run: |
          # 1. Delete your uploaded file to prevent formatting clashes
          rm -f buildozer.spec
          
          # 2. Force Buildozer to build a pristine, fresh config
          buildozer init
          
          # 3. Inject your exact app rules directly into the fresh file
          sed -i 's/title = My Application/title = SpotiClone Pro/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = spoticlone/g' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.ganesh/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,flask,requests,yt-dlp,ytmusicapi/g' buildozer.spec
          
          # 4. The Master License Unlock
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec

      - name: Compile the APK
        run: buildozer -v android debug

      - name: Upload the Finished App
        uses: actions/upload-artifact@v4
        with:
          name: SpotiClone-APK
          path: bin/*.apk
