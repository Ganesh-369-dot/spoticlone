name: Build SpotiClone APK

on:
  workflow_dispatch: 

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java (Crucial for Android)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Linux Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev libtool autoconf automake pkg-config zip unzip

      - name: Install Buildozer & Stable Cython
        run: pip install --upgrade buildozer cython==0.29.33 virtualenv

      - name: Compile the APK
        run: buildozer -v android debug

      - name: Upload the Finished App
        uses: actions/upload-artifact@v4
        with:
          name: SpotiClone-APK
          path: bin/*.apk
          
